spring.datasource.url=jdbc:h2:mem:tenant_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

tenant.security.jwt-secret=test-only-secret-key-that-is-at-least-32-bytes-long
tenant.provisioning.notification-initial-delay=1h
tenant.provisioning.recovery-initial-delay=1h
techdesk.database.require-least-privilege=false
tenant.provisioning-database.require-least-privilege=false
