spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techdesk}
    username: ${SPRING_DATASOURCE_USERNAME:techdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:techdesk_dev_password}
    driver-class-name: org.postgresql.Driver

audit:
  internal-key: ${AUDIT_INTERNAL_KEY:}

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
