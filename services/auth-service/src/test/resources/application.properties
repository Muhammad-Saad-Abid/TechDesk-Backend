spring.datasource.url=jdbc:h2:mem:auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

auth.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
auth.jwt.access-token-minutes=15
auth.jwt.refresh-token-days=7
auth.password-reset.expiration-minutes=30
auth.password-reset.reset-url=http://localhost:5173/reset-password
auth.password-reset.from-address=no-reply@techdesk.test
auth.multitenancy.enabled=false
