spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techdesk}
    username: ${SPRING_DATASOURCE_USERNAME:techdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:techdesk_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  multitenancy:
    enabled: true
    minimum-schema-version: "2"
    audit-service-url: ${AUDIT_SERVICE_URL:http://localhost:8083}
    audit-internal-key: ${AUDIT_INTERNAL_KEY}
  jwt:
    secret: ${AUTH_JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  password-reset:
    expiration-minutes: 30
    reset-url: ${AUTH_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    from-address: ${AUTH_MAIL_FROM:no-reply@techdesk.local}
