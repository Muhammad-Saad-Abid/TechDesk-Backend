name: techdesk-backend

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 8s
  retries: 18
  start_period: 5m

services:
  postgres:
    image: postgres:15.18-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - techdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  database-role-bootstrap:
    image: postgres:15.18-alpine3.24
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      TENANT_DB_USER: ${TENANT_DB_USER}
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD}
      AUDIT_DB_USER: ${AUDIT_DB_USER}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      PROVISIONER_DB_USER: ${PROVISIONER_DB_USER}
      PROVISIONER_DB_PASSWORD: ${PROVISIONER_DB_PASSWORD}
    command:
      - psql
      - --no-password
      - --file=/bootstrap/configure-application-roles.sql
    volumes:
      - ./infrastructure/db/bootstrap:/bootstrap:ro
    depends_on:
      flyway:
        condition: service_completed_successfully
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - techdesk-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4.9-alpine3.21
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - techdesk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  flyway:
    image: redgate/flyway:12.9.0
    command:
      [
        "-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}",
        "-user=${POSTGRES_USER}",
        "-password=${POSTGRES_PASSWORD}",
        "-schemas=public",
        "-defaultSchema=public",
        "-locations=filesystem:/flyway/sql",
        "-connectRetries=60",
        "migrate"
      ]
    volumes:
      - ./infrastructure/db/migration/public:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  discovery-server:
    build:
      context: ./services/discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:8761/actuator/health"
        ]

  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      TENANT_RESOLUTION_JWT_HMAC_SECRET: ${AUTH_JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:8080/actuator/health"
        ]
    depends_on:
      discovery-server:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?ApplicationName=auth-service
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      DATABASE_REQUIRE_LEAST_PRIVILEGE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUDIT_SERVICE_URL: http://audit-service:8083
      AUDIT_INTERNAL_KEY: ${AUDIT_INTERNAL_KEY}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: auth-service
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:8081/actuator/health"
        ]
    depends_on:
      discovery-server:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      database-role-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  tenant-service:
    build:
      context: ./services/tenant-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?ApplicationName=tenant-service
      SPRING_DATASOURCE_USERNAME: ${TENANT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TENANT_DB_PASSWORD}
      DATABASE_REQUIRE_LEAST_PRIVILEGE: "true"
      TENANT_PROVISIONING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?ApplicationName=tenant-provisioner
      TENANT_PROVISIONING_DATASOURCE_USERNAME: ${PROVISIONER_DB_USER}
      TENANT_PROVISIONING_DATASOURCE_PASSWORD: ${PROVISIONER_DB_PASSWORD}
      TENANT_RUNTIME_DB_ROLE: ${AUTH_DB_USER}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: tenant-service
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:8082/actuator/health"
        ]
    depends_on:
      discovery-server:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      database-role-bootstrap:
        condition: service_completed_successfully

  audit-service:
    build:
      context: ./services/audit-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?ApplicationName=audit-service
      SPRING_DATASOURCE_USERNAME: ${AUDIT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUDIT_DB_PASSWORD}
      DATABASE_REQUIRE_LEAST_PRIVILEGE: "true"
      AUDIT_INTERNAL_KEY: ${AUDIT_INTERNAL_KEY}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: audit-service
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "5",
          "http://127.0.0.1:8083/actuator/health"
        ]
    depends_on:
      discovery-server:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      database-role-bootstrap:
        condition: service_completed_successfully

volumes:
  techdesk-postgres-data:
  techdesk-pgadmin-data:
  techdesk-redis-data:
